# Local LmP v96 HDMI/Waydroid smoke configuration for FRDM-IMX95.
# Generic i.MX95 enablement comes from the NXP partner layer; the DD layers
# contribute only product policy and application integration.

header:
  version: 14
  includes:
    - kas/base.yml
    - kas/bsp.yml
    - kas/dynamicdevices.yml

distro: lmp-dynamicdevices
target: lmp-factory-image
machine: imx95-frdm-evk

repos:
  # Pin the reviewed Dynamic Devices product layers so this gate is
  # reproducible without sibling development checkouts.
  meta-dynamicdevices-bsp:
    url: https://github.com/DynamicDevices/meta-dynamicdevices-bsp.git
    commit: 003a440994ca6d95b2bdb746923508c2a1ddc2d3
    path: build/layers/meta-dynamicdevices-bsp

  meta-dynamicdevices-distro:
    url: https://github.com/DynamicDevices/meta-dynamicdevices-distro.git
    commit: f191e4d7f078de100f850787eadbe4133316c2cc
    path: build/layers/meta-dynamicdevices-distro

  bitbake:
    commit: 1c9ec1ffde75809de34c10d3ec2b40d84d258cb4

  openembedded-core:
    commit: 7af6b75221d5703ba5bf43c7cd9f1e7a2e0ed20b

  meta-arm:
    commit: 8e0f8af90fefb03f08cd2228cde7a89902a6b37c

  meta-openembedded:
    commit: f1f248262d662315159ee96c604f97415d1dbe6a

  meta-imx:
    url: https://github.com/nxp-imx/meta-imx.git
    commit: e83d4402acde050d2b2761995761c81c797b5b03
    path: build/layers/meta-imx
    layers:
      meta-imx-bsp:

  meta-freescale:
    url: https://github.com/lmp-mirrors/meta-freescale
    commit: 281202125dee44b45ddd56822e43af9c007e4d3d
    path: build/layers/meta-freescale

  meta-freescale-3rdparty:
    url: https://github.com/lmp-mirrors/meta-freescale-3rdparty
    commit: 70c83e96c7f75e73245cb77f1b0cada9ed4bbc6d
    path: build/layers/meta-freescale-3rdparty

  meta-lmp:
    url: https://github.com/foundriesio/meta-lmp
    commit: 455bf51bd908cb008dd048031247478ffc62a43a
    path: build/layers/meta-lmp
    layers:
      meta-lmp-base:
      meta-lmp-bsp:

  # NXP BSP support is maintained independently as a Foundries partner layer.
  meta-partner-nxp-imx:
    url: https://github.com/active-esl/meta-partner-nxp-imx.git
    commit: 9579dff9c432ba731edc7a02d7b9fcc916852b34
    path: build/layers/meta-partner-nxp-imx

  # Keep IW612 userspace aligned with the same NXP 2.2.0 component release as
  # the partner BSP. This replaces the older DD fork inherited from
  # dynamicdevices.yml for this i.MX95 product gate while retaining its Zigbee
  # RCP layer and adding the IW612 OTBR layer.
  meta-nxp-connectivity:
    url: https://github.com/nxp-imx/meta-nxp-connectivity.git
    commit: 14a32aa7467f58257e3bb93a5c0fa443c70ae1ae
    path: build/layers/meta-nxp-connectivity
    layers:
      meta-nxp-zigbee-rcp:
      meta-nxp-otbr:
    patches:
      0001-scarthgap-compatibility:
        repo: meta-partner-nxp-imx
        path: kas/patches/meta-nxp-connectivity/0001-nxp-otbr-declare-scarthgap-compatibility.patch
      0002-zigbee-scarthgap-compatibility:
        repo: meta-partner-nxp-imx
        path: kas/patches/meta-nxp-connectivity/0002-nxp-zigbee-rcp-declare-scarthgap-compatibility.patch

local_conf_header:
  product-features: |
    DD_PRODUCT_FEATURES = "display android-container"

  imx95-smoke: |
    ACCEPT_FSL_EULA = "1"
    LOCAL_DEVELOPMENT_BUILD = "1"
    DEV_MODE = "1"
    NXP_WIFI_SECURE_FIRMWARE = "0"

    UBOOT_SIGN_ENABLE = "0"
    UBOOT_SPL_SIGN_ENABLE = "0"
    TF_A_SIGN_ENABLE = "0"
    OPTEE_TA_SIGN_ENABLE = "0"
    UEFI_SIGN_ENABLE = "0"
    MODSIGN = "0"
    MODSIGN_ENABLE = "0"
    DISTRO_FEATURES:remove = "modsign"
    SIGN_ENABLE = "0"

    SIGNING_UBOOT_SIGN_KEY = "${TOPDIR}/bitbake.lock"
    SIGNING_UBOOT_SIGN_CRT = "${TOPDIR}/bitbake.lock"
    SIGNING_UBOOT_SPL_SIGN_KEY = "${TOPDIR}/bitbake.lock"
    SIGNING_UBOOT_SPL_SIGN_CRT = "${TOPDIR}/bitbake.lock"
    SIGNING_UEFI_SIGN_KEY = "${TOPDIR}/bitbake.lock"
    SIGNING_UEFI_SIGN_CRT = "${TOPDIR}/bitbake.lock"
    SIGNING_MODSIGN_PRIVKEY = "${TOPDIR}/bitbake.lock"
    SIGNING_MODSIGN_X509 = "${TOPDIR}/bitbake.lock"
    TF_A_SIGN_KEY_PATH = "${TOPDIR}/bitbake.lock"

    INHERIT:remove = "sign_rpm create-spdx spdx"
    CREATE_SPDX:forcevariable = "0"
