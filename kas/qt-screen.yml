header:
  version: 14
  includes:
    - lmp-dynamicdevices-dev.yml

machine: imx8mm-jaguar-screen
distro: lmp-dynamicdevices-headless

local_conf_header:
  qt-screen-prototype: |
    QT_GIT_PROTOCOL = "https"
    BBMASK += "meta-dynamicdevices-distro/recipes-graphics/godot/godot_.*[.]bbappend"
    # Local proof builds require a syntactically valid module-signing identity.
    # These files are throwaway build/conf artifacts and are never committed.
    MODSIGN_PRIVKEY:forcevariable = "${TOPDIR}/conf/factory-keys/modsign.key"
    MODSIGN_X509:forcevariable = "${TOPDIR}/conf/factory-keys/modsign.crt"
