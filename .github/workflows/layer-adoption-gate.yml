name: Layer Adoption Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Baseline commit to compare
        required: true

concurrency:
  group: layer-adoption-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect material layer change
    runs-on: [self-hosted, Linux, X64]
    outputs:
      material: ${{ steps.detect.outputs.material }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: base
        name: Resolve immutable baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.base_sha }}
        run: |
          sha="${PR_BASE:-${INPUT_BASE:-${PUSH_BASE:-}}}"
          if [ -z "$sha" ] || printf '%s' "$sha" | grep -Eq '^0+$'; then
            sha=$(git rev-parse HEAD^)
          fi
          git cat-file -e "$sha^{commit}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: detect
        name: Require an adoption contract
        run: |
          python3 -m unittest discover -s scripts/validation/tests -p 'test_*.py'
          python3 scripts/validation/detect-layer-adoption.py \
            --base '${{ steps.base.outputs.sha }}' \
            --head '${{ github.sha }}' \
            --github-output "$GITHUB_OUTPUT"
      - id: matrix
        name: Publish protected tuple matrix
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("ci/layer-adoption-tuples.json", encoding="utf-8") as source:
              matrix = {"include": json.load(source)["tuples"]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          PY

  regression:
    name: Protect ${{ matrix.id }}
    needs: detect
    if: needs.detect.outputs.material == 'true'
    strategy:
      fail-fast: false
      # Full Yocto baseline/candidate pairs are I/O and disk intensive. Keep
      # the hard gate comprehensive without overwhelming one self-hosted host.
      max-parallel: 2
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    runs-on: [self-hosted, Linux, X64, yocto]
    container:
      image: dynamicdevices/yocto-ci-build:latest
      options: --privileged --platform linux/amd64
    env:
      LAYER_ADOPTION_TEST_KEYS_DIR: /tmp/layer-adoption-keys-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
    steps:
      - name: Reset job-owned workspace
        run: |
          workspace=$(realpath -m -- "$GITHUB_WORKSPACE")
          test -n "$workspace"
          test "$workspace" != /
          for name in candidate baseline evidence; do
            target=$(realpath -m -- "$workspace/$name")
            test "$(dirname "$target")" = "$workspace"
            rm -rf -- "$target"
          done
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: candidate
      - name: Create baseline worktree
        working-directory: candidate
        run: git worktree add ../baseline '${{ needs.detect.outputs.base_sha }}'
      - name: Install KAS when absent
        run: command -v kas >/dev/null || pip3 install kas
      - name: Restore Yocto caches
        uses: actions/cache@v6
        with:
          path: |
            ~/yocto/downloads
            ~/yocto/sstate-cache
          key: layer-adoption-${{ matrix.machine }}-${{ hashFiles('candidate/kas/**') }}
          restore-keys: |
            layer-adoption-${{ matrix.machine }}-
            layer-adoption-
      - name: Require safe build capacity
        run: |
          available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          minimum_kib=$((150 * 1024 * 1024))
          if [ "$available_kib" -lt "$minimum_kib" ]; then
            echo "ERROR: layer-adoption build requires at least 150 GiB free; found $((available_kib / 1024 / 1024)) GiB" >&2
            exit 1
          fi
      - name: Generate ephemeral signing keys
        run: candidate/scripts/validation/generate-layer-adoption-test-keys.sh "$LAYER_ADOPTION_TEST_KEYS_DIR"
      - name: Build and capture baseline
        working-directory: baseline
        run: |
          ../candidate/scripts/validation/capture-layer-state.sh \
            '${{ matrix.config }}' '${{ matrix.machine }}' '${{ matrix.distro }}' \
            '${{ matrix.image }}' '${{ matrix.product_features }}' \
            '../evidence/baseline/${{ matrix.id }}'
      - name: Release baseline build workspace
        run: |
          workspace=$(realpath -m -- "$GITHUB_WORKSPACE")
          target=$(realpath -m -- "$workspace/baseline/build")
          test "$target" = "$workspace/baseline/build"
          rm -rf -- "$target"
      - name: Build and capture candidate
        working-directory: candidate
        run: |
          scripts/validation/capture-layer-state.sh \
            '${{ matrix.config }}' '${{ matrix.machine }}' '${{ matrix.distro }}' \
            '${{ matrix.image }}' '${{ matrix.product_features }}' \
            '../evidence/candidate/${{ matrix.id }}'
      - name: Reject unexplained contamination
        run: |
          python3 candidate/scripts/validation/compare-layer-state.py \
            --baseline 'evidence/baseline/${{ matrix.id }}' \
            --candidate 'evidence/candidate/${{ matrix.id }}' \
            --tuple '${{ matrix.id }}' \
            --contract candidate/ci/layer-adoption-contract.json
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layer-adoption-${{ matrix.id }}
          path: evidence
          retention-days: 14
      - name: Remove job-owned build trees
        if: always()
        run: |
          workspace=$(realpath -m -- "$GITHUB_WORKSPACE")
          test -n "$workspace"
          test "$workspace" != /
          for name in candidate/build baseline/build evidence; do
            target=$(realpath -m -- "$workspace/$name")
            case "$target" in
              "$workspace/candidate/build"|"$workspace/baseline/build"|"$workspace/evidence") ;;
              *) echo "ERROR: refusing unsafe cleanup target: $target" >&2; exit 1 ;;
            esac
            rm -rf -- "$target"
          done

  required:
    name: Layer Adoption Gate
    needs: [detect, regression]
    if: always()
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Enforce gate result
        env:
          DETECT: ${{ needs.detect.result }}
          MATERIAL: ${{ needs.detect.outputs.material }}
          REGRESSION: ${{ needs.regression.result }}
        run: |
          test "$DETECT" = success
          if [ "$MATERIAL" = true ]; then
            test "$REGRESSION" = success
          else
            test "$REGRESSION" = skipped
          fi
