name: Layer Adoption Gate

on:
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Baseline commit to compare
        required: true
      tuple_id:
        description: One protected tuple to build for focused development
        required: true
        default: imx8mm-jaguar-screen-waydroid-image

concurrency:
  group: layer-adoption-${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect material layer change
    runs-on: [self-hosted, Linux, X64, yocto, dd-esl-proxmox]
    outputs:
      material: ${{ steps.detect.outputs.material }}
      base_sha: ${{ steps.base.outputs.sha }}
      tuple_ids: ${{ steps.detect.outputs.tuple_ids }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: base
        name: Resolve immutable baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.base_sha }}
        run: |
          sha="${PR_BASE:-${MERGE_BASE:-${INPUT_BASE:-${PUSH_BASE:-}}}}"
          if [ -z "$sha" ] || printf '%s' "$sha" | grep -Eq '^0+$'; then
            sha=$(git rev-parse HEAD^)
          fi
          git cat-file -e "$sha^{commit}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: detect
        name: Validate repository and require an adoption contract
        run: |
          python3 -m unittest discover -s scripts/validation/tests -p 'test_*.py'
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          python3 -m json.tool ci/layer-adoption-contract.json >/dev/null
          python3 -m json.tool ci/layer-adoption-tuples.json >/dev/null
          # Mail-format patch payloads legitimately contain the conventional
          # "-- " separator. Check repository sources without rewriting the
          # third-party patches that BitBake applies.
          git diff --check '${{ steps.base.outputs.sha }}...${{ github.sha }}' -- . ':(exclude)**/*.patch'
          python3 scripts/validation/detect-layer-adoption.py \
            --base '${{ steps.base.outputs.sha }}' \
            --head '${{ github.sha }}' \
            --github-output "$GITHUB_OUTPUT"
          if [ '${{ github.event_name }}' = workflow_dispatch ]; then
            tuple_ids=$(python3 -c 'import json,sys; ids=[entry["id"] for entry in json.load(open("ci/layer-adoption-tuples.json"))["tuples"]]; requested=sys.argv[1]; requested in ids or sys.exit(f"unknown protected tuple: {requested}"); print(json.dumps([requested],separators=(",",":")))' '${{ inputs.tuple_id }}')
          else
            tuple_ids=$(python3 -c 'import json; print(json.dumps([entry["id"] for entry in json.load(open("ci/layer-adoption-tuples.json"))["tuples"]], separators=(",", ":")))')
          fi
          echo "tuple_ids=$tuple_ids" >> "$GITHUB_OUTPUT"
  regression:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Development validation — baseline comparison' || 'Product readiness validation — baseline comparison' }} (${{ matrix.tuple_id }})
    needs: detect
    if: needs.detect.outputs.material == 'true'
    strategy:
      fail-fast: false
      matrix:
        tuple_id: ${{ fromJSON(needs.detect.outputs.tuple_ids) }}
    # Each tuple is an independent shard so one failure cannot hide later
    # product failures. The final Layer Adoption Gate remains the single
    # branch-protection contract, and local driver runs still cover all tuples.
    runs-on: [self-hosted, Linux, X64, yocto, dd-esl-proxmox]
    container:
      image: ghcr.io/siemens/kas/kas@sha256:d989add57fc441fe9e27bb2dd6ed98c5597b44c807928e35a72dc1cfbdda9abe
      # Match the dedicated DD registration on CT101 so BitBake's root-user
      # sanity check remains active and the /yocto cache stays writable.
      options: --privileged --platform linux/amd64 --user 999:995 -v /yocto/yocto-layer-adoption:/var/cache/layer-adoption
    env:
      LAYER_ADOPTION_CACHE: /var/cache/layer-adoption
    steps:
      - name: Reset job-owned workspace
        run: |
          workspace=$(realpath -m -- "$GITHUB_WORKSPACE")
          test -n "$workspace"
          test "$workspace" != /
          for name in candidate baseline evidence; do
            target=$(realpath -m -- "$workspace/$name")
            test "$(dirname "$target")" = "$workspace"
            rm -rf -- "$target"
          done
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: candidate
      - name: Create baseline worktree
        working-directory: candidate
        run: git worktree add ../baseline '${{ needs.detect.outputs.base_sha }}'
      - name: Require safe build capacity
        run: |
          available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          minimum_kib=$((150 * 1024 * 1024))
          if [ "$available_kib" -lt "$minimum_kib" ]; then
            echo "ERROR: layer-adoption build requires at least 150 GiB free; found $((available_kib / 1024 / 1024)) GiB" >&2
            exit 1
          fi
      - name: Prepare persistent test-only signing identity
        run: |
          set -euo pipefail
          keys="$LAYER_ADOPTION_CACHE/test-keys"
          if ! candidate/scripts/validation/generate-layer-adoption-test-keys.sh \
              --check "$keys"; then
            test "$keys" = /var/cache/layer-adoption/test-keys
            rm -rf -- "$keys"
            rm -rf -- "$LAYER_ADOPTION_CACHE/baselines"
            temporary=$(mktemp -d "$LAYER_ADOPTION_CACHE/.test-keys.XXXXXX")
            candidate/scripts/validation/generate-layer-adoption-test-keys.sh "$temporary"
            mv "$temporary" "$keys"
          fi
      - name: Build and compare selected protected tuple
        run: |
          python3 candidate/scripts/validation/run-layer-adoption-regression.py \
            --baseline baseline \
            --candidate candidate \
            --evidence evidence \
            --cache "$LAYER_ADOPTION_CACHE" \
            --test-keys "$LAYER_ADOPTION_CACHE/test-keys" \
            --tuple-id '${{ matrix.tuple_id }}'
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layer-adoption-evidence-${{ matrix.tuple_id }}
          path: evidence
          retention-days: 14
      - name: Remove job-owned build trees
        if: always()
        run: |
          workspace=$(realpath -m -- "$GITHUB_WORKSPACE")
          test -n "$workspace"
          test "$workspace" != /
          for name in candidate/build baseline/build evidence; do
            target=$(realpath -m -- "$workspace/$name")
            case "$target" in
              "$workspace/candidate/build"|"$workspace/baseline/build"|"$workspace/evidence") ;;
              *) echo "ERROR: refusing unsafe cleanup target: $target" >&2; exit 1 ;;
            esac
            rm -rf -- "$target"
          done

  required:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Development Validation' || 'Layer Adoption Gate' }}
    needs: [detect, regression]
    if: always()
    runs-on: [self-hosted, Linux, X64, yocto, dd-esl-proxmox]
    steps:
      - name: Enforce gate result
        env:
          DETECT: ${{ needs.detect.result }}
          MATERIAL: ${{ needs.detect.outputs.material }}
          REGRESSION: ${{ needs.regression.result }}
        run: |
          test "$DETECT" = success
          if [ "$MATERIAL" = true ]; then
            test "$REGRESSION" = success
          else
            test "$REGRESSION" = skipped
          fi
