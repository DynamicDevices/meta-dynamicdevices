[Unit]
Requires=waydroid-zram.service
After=waydroid-zram.service

[Service]
# Provisional limits for the 2 GB board. Validate under the shipping kiosk
# workload before release; MemoryHigh provides reclaim pressure before the hard
# cap while reserving roughly 512 MiB for Linux, display and update services.
MemoryAccounting=yes
MemoryHigh=1200M
MemoryMax=1500M
MemorySwapMax=768M
OOMPolicy=stop
